[package]
name = "vesper-aura"
version = "0.1.0"
edition = "2024"
description = "Bounded keyed Aura view reconciliation and transactional retained backend contract"
publish = false
build = "build.rs"

[features]
# A deliberately wrong Vesper build, one edit per ported module: the tests
# must fail (scripts/test-port-harness.sh asserts which ones do).
vesper-port-divergent = []

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi" }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness" }
