[package]
name = "vesper-bench"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded ABBA callback measurements and exact paired median confidence gates (Rust, with an optional Vesper port)"
build = "build.rs"

# The compiler and every crate inside `cargo tree -p vesper -e normal,build`
# use the frozen Rust seed copy, crates/vesper-bench/seed (package
# vesper-bench-seed, same library name), instead of this package; see
# "Crates the compiler links" in docs/maintenance/porting-a-crate.md.
#
# This package builds the same Rust by default, and every other port's ABBA
# benchmark uses that build. Under `vesper-port`, build.rs links the Vesper
# port in vesper/ and sets cfg(vesper_port), and the statistics, contracts,
# wire format and the drivers' pure folds forward to it (port wave P3a
# lane 5, #1040). The port is not the default for any dependent until it
# reaches parity with the Rust build (docs/parallel-results/port-p3-bench.md).

[features]
vesper-port = ["dep:vesper-port-abi", "dep:vesper-port-harness"]
# Deliberately wrong Vesper builds, one edit per ported module: the port
# test runs must fail (scripts/test-port-harness.sh asserts which tests do).
vesper-port-divergent = ["vesper-port"]

[dependencies]
vesper-port-abi = { path = "../vesper-port-abi", optional = true }

[dev-dependencies]
# The frozen Rust build, for the ABBA benchmark against the port
# (examples/abba.rs).
vesper-bench-rust = { path = "seed", package = "vesper-bench-seed" }

[build-dependencies]
# Optional (unlike vesper-beacon's): the other ports' seeds, which the
# compiler links, take this package as a dev-dependency, and the harness
# depends on the compiler, so an unconditional build-dependency is a
# dependency cycle under Bazel.
vesper-port-harness = { path = "../vesper-port-harness", optional = true }

[lints.rust]
# cfg(vesper_port) is set only by this package's build script.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vesper_port)"] }
