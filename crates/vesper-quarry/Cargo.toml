[package]
name = "vesper-quarry"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded deterministic host SQL catalog, checked plans, row and vectorized executors, and a durable WAL-recovered page store"
build = "build.rs"

[features]
# Run the SQL front end, optimizer and row executor in Vesper
# (vesper/src/lib.ves) through the committed binding port/binding.rs.
vesper-port = ["dep:vesper-port-abi", "dep:vesper-port-harness"]
# A deliberately wrong Vesper build: the port test run must fail.
vesper-port-divergent = ["vesper-port"]

[dependencies]
vesper-simd = { path = "../vesper-simd" }
vesper-port-abi = { path = "../vesper-port-abi", optional = true }

[build-dependencies]
vesper-port-harness = { path = "../vesper-port-harness", optional = true }

[dev-dependencies]
vesper-bench = { path = "../vesper-bench" }
